<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kalo · Asistente nutricional</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a,button{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F97316;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8C7A6E}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:#D13D0A}a:hover{color:#9A2E06}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2B1810; display: flex; flex-direction: column; overflow: hidden;">
  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 12px; padding: 48px 16px 12px; border-bottom: 1px solid #F2E4DA;">
    <div style="width: 44px; height: 44px; flex-shrink: 0; border-radius: 50%; overflow: hidden; position: relative; background: #F04A1A;"><img src="../assets/kalo-mascot.png" alt="Mascota de Kalo" style="position: absolute; width: 79px; height: 79px; left: -17px; top: -16px;"></div>
    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
      <h1 style="margin: 0; font-size: 17px; font-weight: 800;">Asistente Kalo</h1>
      <div style="display: flex; align-items: center; gap: 6px; font-size: 12px; color: #7A6458; font-weight: 500;"><span style="width: 7px; height: 7px; border-radius: 50%; background: #F97316;"></span>Nutriólogo IA · Claude Sonnet</div>
    </div>
    <a href="ProveedorIA.dc.html" aria-label="Configurar proveedor de IA" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid #F2E4DA; color: #2B1810; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h4M12 12h8M4 18h12"></path><circle cx="16" cy="6" r="2"></circle><circle cx="10" cy="12" r="2"></circle><circle cx="18" cy="18" r="2"></circle></svg></a>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 8px 16px; background: #FFF8F2; font-size: 12px; color: #5A4337; font-weight: 500; line-height: 1.4;">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="#D13D0A" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>
    Orientación general sobre alimentación. No reemplaza a un profesional de la salud.
  </div>

  <div style="flex-grow: 1; min-height: 0; overflow-y: auto; padding: 14px 16px; display: flex; flex-direction: column; gap: 12px;">
    <div style="align-self: center; padding: 6px 12px; border-radius: 999px; background: #FFF0E3; color: #9A2E06; font-size: 12px; font-weight: 700;">Hoy: 1.190 kcal · 52 g de proteína</div>
    <sc-for list="{{messages}}" as="m" hint-placeholder-count="3">
      <div style="{{m.wrap}}">
        <div style="{{m.bubble}}">{{m.text}}</div>
        <sc-for list="{{m.cards}}" as="c" hint-placeholder-count="0">
          <div style="display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 14px; border: 1px solid #F2E4DA; background: #FFFFFF;">
            <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;">
              <span style="font-size: 13px; font-weight: 700;">{{c.name}}</span>
              <span style="font-size: 12px; color: #7A6458; font-weight: 500;">{{c.macros}}</span>
            </span>
            <a href="Manual.dc.html" style="height: 36px; padding: 0 12px; border-radius: 999px; background: #FFF0E3; color: #9A2E06; font-size: 12px; font-weight: 700; display: flex; align-items: center; text-decoration: none;">Registrar</a>
          </div>
        </sc-for>
      </div>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; display: flex; gap: 8px; overflow-x: auto; padding: 4px 16px 8px;">
    <sc-for list="{{chips}}" as="q" hint-placeholder-count="4">
      <button type="button" onClick="{{q.pick}}" style="flex-shrink: 0; height: 38px; padding: 0 14px; border-radius: 999px; border: 1px solid #FFD3B0; background: #FFFFFF; color: #9A2E06; font: 600 12px 'Plus Jakarta Sans', sans-serif;">{{q.label}}</button>
    </sc-for>
  </div>

  <div style="flex-shrink: 0; display: flex; align-items: center; gap: 8px; padding: 4px 16px 10px;">
    <label for="msg" style="position: absolute; width: 1px; height: 1px; overflow: hidden;">Escribe tu consulta</label>
    <input id="msg" type="text" value="{{draft}}" onChange="{{setDraft}}" placeholder="Pregunta sobre tu alimentación…" style="flex-grow: 1; height: 48px; box-sizing: border-box; padding: 0 16px; border: 1px solid #F2E4DA; border-radius: 999px; background: #FFF8F2; font: 500 14px 'Plus Jakarta Sans', sans-serif; color: #2B1810; outline: none;">
    <button type="button" aria-label="Enviar" onClick="{{send}}" style="width: 48px; height: 48px; flex-shrink: 0; border-radius: 50%; border: 0; background: #D13D0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"></path></svg></button>
  </div>

  <nav aria-label="Navegación principal" style="flex-shrink: 0; height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #F2E4DA; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 4px 6px 20px;">
    <a href="Inicio.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7A6458; font-size: 12px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Registros.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7A6458; font-size: 12px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9zM7 5.5H5.5v15h13v-15H17M9 12h6M9 16h4"></path></svg>Registros</a>
    <a href="Mas.dc.html" aria-label="Registro rápido" style="justify-self: center; width: 58px; height: 58px; margin-top: -26px; border-radius: 50%; background: #D13D0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #FFFFFF; box-sizing: border-box;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Asistente.dc.html" aria-current="page" style="height: 52px; margin: 0 2px; border-radius: 16px; background: #FFF0E3; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #D13D0A; font-size: 12px; font-weight: 800;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"></path></svg>Asistente</a>
    <a href="Progreso.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7A6458; font-size: 12px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 20v-6M12 20V8M18 20v-10"></path></svg>Progreso</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      draft: '',
      messages: [
        { role: 'ai', text: 'Hola Carlos, soy tu asistente nutricional. Vas en 1.190 kcal y 52 g de proteína. Te faltan 660 kcal y 88 g de proteína. ¿En qué te ayudo?' },
        { role: 'user', text: '¿Qué puedo cenar para llegar a mi proteína?' },
        { role: 'ai', text: 'Con unas 600 kcal disponibles, estas opciones te acercan a tu meta de proteína:', cards: [
          { name: 'Salmón a la plancha con quinua', macros: '520 kcal · 38 g de proteína' },
          { name: 'Pechuga con ensalada y camote', macros: '480 kcal · 42 g de proteína' },
          { name: 'Tortilla de claras con verduras', macros: '350 kcal · 30 g de proteína' }
        ] }
      ]
    };
  }
  reply(q) {
    const answers = {
      'Ideas altas en proteína': { text: 'Opciones fáciles: yogur griego con frutos secos, huevos cocidos, atún con palta, queso fresco con tostada integral.', cards: [{ name: 'Yogur griego con nueces', macros: '220 kcal · 18 g de proteína' }, { name: '2 huevos cocidos', macros: '140 kcal · 12 g de proteína' }] },
      '¿Cómo reduzco el azúcar?': { text: 'Cambia las bebidas azucaradas por agua o infusiones, elige fruta entera en vez de jugo y revisa la etiqueta: apunta a menos de 50 g al día, tu meta actual.' },
      'Snack antes de dormir': { text: 'Algo ligero y con proteína: yogur natural con canela o un puñado pequeño de almendras. Evita el azúcar para no afectar tu sueño.' },
      '¿Cuánto licor es razonable?': { text: 'Cada bebida suma unas 150 kcal y no aporta proteína. Si quieres bajar de peso, mejor limitarlo a ocasiones puntuales y tomar agua entre bebidas.' }
    };
    return answers[q] || { text: 'Con tu meta de 1.850 kcal y 140 g de proteína, lo ideal es repartir la proteína en 3 o 4 comidas. ¿Quieres que te sugiera un menú para mañana?' };
  }
  ask(q) {
    const r = this.reply(q);
    this.setState({ draft: '', messages: [...this.state.messages, { role: 'user', text: q }, { role: 'ai', text: r.text, cards: r.cards || [] }] });
  }
  renderVals() {
    const s = this.state;
    return {
      draft: s.draft,
      setDraft: (e) => this.setState({ draft: e.target.value }),
      send: () => { if (s.draft.trim()) this.ask(s.draft.trim()); },
      messages: s.messages.map((m) => {
        const user = m.role === 'user';
        return {
          text: m.text,
          cards: m.cards || [],
          wrap: 'display: flex; flex-direction: column; gap: 8px; max-width: 300px; align-self: ' + (user ? 'flex-end' : 'flex-start') + ';',
          bubble: 'padding: 11px 14px; border-radius: ' + (user ? '18px 18px 4px 18px' : '18px 18px 18px 4px') + '; font-size: 14px; line-height: 1.5; font-weight: 500; background: ' + (user ? '#D13D0A' : '#F8F1EB') + '; color: ' + (user ? '#FFFFFF' : '#2B1810') + ';'
        };
      }),
      chips: ['Ideas altas en proteína', '¿Cómo reduzco el azúcar?', 'Snack antes de dormir', '¿Cuánto licor es razonable?'].map((l) => ({ label: l, pick: () => this.ask(l) }))
    };
  }
}
</script>
</body>
</html>
