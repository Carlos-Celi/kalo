<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kalo · Recordatorios</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a,button{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F97316;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8C7A6E}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:#D13D0A}a:hover{color:#9A2E06}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2B1810; display: flex; flex-direction: column; padding: 48px 16px 28px; gap: 14px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="Inicio.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 50%; background: #F8F1EB; color: #2B1810; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; text-align: center; font-size: 16px; font-weight: 700;">Recordatorios</div>
    <button type="button" aria-label="Nuevo recordatorio" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #D13D0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></button>
  </div>
  <div style="font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #7A6458;">{{activeLabel}}</div>
  <div style="border: 1px solid #F2E4DA; border-radius: 18px; padding: 0 14px;">
    <sc-for list="{{items}}" as="r" hint-placeholder-count="7">
      <div style="{{r.row}}">
        <span style="width: 36px; height: 36px; flex-shrink: 0; border-radius: 50%; background: #FFF0E3; color: #D13D0A; display: flex; align-items: center; justify-content: center;">
          <sc-if value="{{r.isDrop}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg></sc-if>
          <sc-if value="{{r.isFork}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 1-3 4-3 7h3v11"></path></svg></sc-if>
          <sc-if value="{{r.isGym}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M4 8l4-4M16 20l4-4M3 11l8-8M13 21l8-8"></path></svg></sc-if>
          <sc-if value="{{r.isMoon}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
          <sc-if value="{{r.isScale}}" hint-placeholder-val="{{ false }}"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="4"></rect><path d="M9 9a4 4 0 0 1 6 0l-2 3"></path></svg></sc-if>
        </span>
        <span style="flex-grow: 1; display: flex; flex-direction: column;">
          <span style="font-size: 14px; font-weight: 700;">{{r.name}}</span>
          <span style="font-size: 12px; color: #7A6458; font-weight: 500;">{{r.when}}</span>
        </span>
        <button type="button" role="switch" aria-checked="{{r.checked}}" aria-label="{{r.name}}" onClick="{{r.toggle}}" style="{{r.track}}"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: block;"></span></button>
      </div>
    </sc-for>
  </div>
  <div style="display: flex; gap: 10px; padding: 14px; border-radius: 16px; background: #FFF0E3; color: #9A2E06; font-size: 12px; font-weight: 600; line-height: 1.5;">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0; margin-top: 2px;"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
    Avisos inteligentes: no te avisamos si ya registraste esa comida o llegaste a tu meta de agua.
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { agua: true, comidas: true, ejer: false, dormir: true, peso: true, resumen: false } };
  }
  renderVals() {
    const defs = [
      { id: 'agua', icon: 'drop', name: 'Beber agua', when: 'Cada 2 horas · 8:00 a 20:00' },
      { id: 'comidas', icon: 'fork', name: 'Registrar comidas', when: '8:00 · 13:00 · 20:00' },
      { id: 'ejer', icon: 'gym', name: 'Ejercicio', when: 'Lun, mié, vie · 18:00' },
      { id: 'dormir', icon: 'moon', name: 'Ir a dormir', when: 'Todos los días · 22:30' },
      { id: 'peso', icon: 'scale', name: 'Pesarte', when: 'Lunes · 7:00' }
    ];
    const on = this.state.on;
    const count = defs.filter((d) => on[d.id]).length;
    return {
      activeLabel: count + ' DE ' + defs.length + ' ACTIVOS',
      items: defs.map((d, i) => {
        const v = !!on[d.id];
        return {
          ...d,
          isDrop: d.icon === 'drop', isFork: d.icon === 'fork', isGym: d.icon === 'gym', isMoon: d.icon === 'moon', isScale: d.icon === 'scale',
          checked: v ? 'true' : 'false',
          row: 'display: flex; align-items: center; gap: 12px; padding: 12px 0;' + (i < defs.length - 1 ? ' border-bottom: 1px solid #F6ECE4;' : ''),
          toggle: () => this.setState({ on: { ...on, [d.id]: !v } }),
          track: 'width: 50px; height: 30px; flex-shrink: 0; border-radius: 999px; border: 0; padding: 3px; display: flex; justify-content: ' + (v ? 'flex-end' : 'flex-start') + '; background: ' + (v ? '#D13D0A' : '#DCCFC6') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
