<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kalo · Configuración</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a,button{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F97316;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8C7A6E}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:#D13D0A}a:hover{color:#9A2E06}
</style>
</helmet>
<div style="width: 390px; height: 980px; box-sizing: border-box; position: relative; overflow: hidden; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2B1810;">
  <div style="padding: 52px 16px 100px; display: flex; flex-direction: column; gap: 12px;">
    <h1 style="margin: 0; font-size: 24px; font-weight: 800; letter-spacing: -0.5px;">Configuración</h1>

    <div style="display: flex; align-items: center; gap: 14px; padding: 14px; border-radius: 18px; background: #FFF0E3;">
      <div style="width: 52px; height: 52px; border-radius: 50%; background: #D13D0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 800;">C</div>
      <div style="flex-grow: 1;"><div style="font-size: 17px; font-weight: 800;">Carlos</div><div style="font-size: 12px; color: #7A6458; font-weight: 500;">27 años · 172 cm · 78 kg</div></div>
      <a href="Perfil.dc.html" aria-label="Editar perfil" style="width: 44px; height: 44px; border-radius: 50%; background: #FFFFFF; color: #D13D0A; display: flex; align-items: center; justify-content: center;"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></a>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #7A6458;">METAS DIARIAS</h2>
    <div style="border: 1px solid #F2E4DA; border-radius: 18px; padding: 0 12px;">
      <sc-for list="{{metas}}" as="m" hint-placeholder-count="4">
        <a href="Metas.dc.html" style="{{m.row}}">
          <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #FFF0E3; color: #D13D0A; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{m.isFlame}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3c1 4 5 5 5 10a5 5 0 0 1-10 0c0-3 2-4 2-6 2 1 3 2 3 4 1-2 1-5 0-8z"></path></svg></sc-if>
            <sc-if value="{{m.isDrop}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg></sc-if>
            <sc-if value="{{m.isGym}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M4 8l4-4M16 20l4-4M3 11l8-8M13 21l8-8"></path></svg></sc-if>
            <sc-if value="{{m.isProt}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14.5 4.5a4.5 4.5 0 1 1 5 5l-6.2 6.2a2.6 2.6 0 1 1-3.7-3.7z"></path><path d="M10 14l-3.5 3.5"></path></svg></sc-if>
            <sc-if value="{{m.isMoon}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
          </span>
          <span style="flex-grow: 1; font-size: 14px; font-weight: 600;">{{m.label}}</span>
          <span style="font-size: 13px; color: #7A6458; font-weight: 500;">{{m.value}}</span>
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6458" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
        </a>
      </sc-for>
    </div>

    <h2 style="margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #7A6458;">INTELIGENCIA ARTIFICIAL</h2>
    <a href="ProveedorIA.dc.html" style="display: flex; align-items: center; gap: 12px; padding: 14px; border: 1px solid #F2E4DA; border-radius: 18px; text-decoration: none; color: #2B1810;">
      <span style="width: 40px; height: 40px; flex-shrink: 0; border-radius: 12px; background: #D13D0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg></span>
      <span style="flex-grow: 1; display: flex; flex-direction: column; gap: 2px;"><span style="font-size: 14px; font-weight: 700;">Proveedor, API key y modelo</span><span style="font-size: 12px; color: #7A6458; font-weight: 500;">Anthropic · Claude Sonnet</span></span>
      <span style="padding: 3px 8px; border-radius: 999px; background: #FFE6D2; color: #9A2E06; font-size: 12px; font-weight: 700;">Conectado</span>
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#7A6458" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 5l7 7-7 7"></path></svg>
    </a>

    <h2 style="margin: 4px 0 0; font-size: 12px; font-weight: 700; letter-spacing: 0.8px; color: #7A6458;">RECORDATORIOS</h2>
    <div style="border: 1px solid #F2E4DA; border-radius: 18px; padding: 0 12px;">
      <sc-for list="{{rec}}" as="r" hint-placeholder-count="4">
        <div style="{{r.row}}">
          <span style="width: 32px; height: 32px; flex-shrink: 0; border-radius: 50%; background: #FFF0E3; color: #D13D0A; display: flex; align-items: center; justify-content: center;">
            <sc-if value="{{r.isDrop}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z"></path></svg></sc-if>
            <sc-if value="{{r.isFork}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M7 3v8M4 3v5a3 3 0 0 0 6 0V3M7 11v10M17 3c-2 1-3 4-3 7h3v11"></path></svg></sc-if>
            <sc-if value="{{r.isGym}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M4 8l4-4M16 20l4-4M3 11l8-8M13 21l8-8"></path></svg></sc-if>
            <sc-if value="{{r.isMoon}}" hint-placeholder-val="{{ false }}"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5z"></path></svg></sc-if>
          </span>
          <span style="flex-grow: 1; display: flex; flex-direction: column;"><span style="font-size: 14px; font-weight: 600;">{{r.name}}</span><span style="font-size: 12px; color: #7A6458; font-weight: 500;">{{r.when}}</span></span>
          <button type="button" role="switch" aria-checked="{{r.checked}}" aria-label="{{r.name}}" onClick="{{r.toggle}}" style="{{r.track}}"><span style="width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; display: block;"></span></button>
        </div>
      </sc-for>
    </div>
    <div style="display: flex; justify-content: space-between; padding: 4px 4px 0; font-size: 13px; font-weight: 700;">
      <a href="Recordatorios.dc.html" style="text-decoration: none;">Ver todos los recordatorios</a>
      <a href="Login.dc.html" style="text-decoration: none; color: #B42318;">Cerrar sesión</a>
    </div>
  </div>

  <nav aria-label="Navegación principal" style="position: absolute; left: 0; right: 0; bottom: 0; height: 84px; box-sizing: border-box; background: #FFFFFF; border-top: 1px solid #F2E4DA; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: center; padding: 4px 6px 20px;">
    <a href="Inicio.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7A6458; font-size: 12px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6h-6v6H4a1 1 0 0 1-1-1z"></path></svg>Inicio</a>
    <a href="Registros.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7A6458; font-size: 12px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 4h6v3H9zM7 5.5H5.5v15h13v-15H17M9 12h6M9 16h4"></path></svg>Registros</a>
    <a href="Mas.dc.html" aria-label="Registro rápido" style="justify-self: center; width: 58px; height: 58px; margin-top: -26px; border-radius: 50%; background: #D13D0A; color: #FFFFFF; display: flex; align-items: center; justify-content: center; border: 4px solid #FFFFFF; box-sizing: border-box;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg></a>
    <a href="Asistente.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7A6458; font-size: 12px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M4 5h16v11H10l-6 4z"></path></svg>Asistente</a>
    <a href="Progreso.dc.html" style="height: 52px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; text-decoration: none; color: #7A6458; font-size: 12px; font-weight: 500;"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true"><path d="M6 20v-6M12 20V8M18 20v-10"></path></svg>Progreso</a>
  </nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { on: { agua: true, comidas: true, ejer: false, dormir: true } };
  }
  renderVals() {
    const sep = (i, n) => (i < n - 1 ? ' border-bottom: 1px solid #F6ECE4;' : '');
    const metas = [
      { icon: 'prot', label: 'Proteína · principal', value: '140 g' },
      { icon: 'flame', label: 'Calorías · principal', value: '1.850 kcal' },
      { icon: 'drop', label: 'Agua', value: '2,5 L' },
      { icon: 'gym', label: 'Ejercicio', value: '60 min' },
      { icon: 'moon', label: 'Sueño', value: '8 h' }
    ];
    const recs = [
      { id: 'agua', icon: 'drop', name: 'Beber agua', when: 'Cada 2 horas · 8:00 a 20:00' },
      { id: 'comidas', icon: 'fork', name: 'Registrar comidas', when: '8:00 · 13:00 · 20:00' },
      { id: 'ejer', icon: 'gym', name: 'Ejercicio', when: '18:00' },
      { id: 'dormir', icon: 'moon', name: 'Ir a dormir', when: '22:30' }
    ];
    const on = this.state.on;
    return {
      metas: metas.map((m, i) => ({
        ...m,
        isProt: m.icon === 'prot', isFlame: m.icon === 'flame', isDrop: m.icon === 'drop', isGym: m.icon === 'gym', isMoon: m.icon === 'moon',
        row: 'display: flex; align-items: center; gap: 12px; min-height: 50px; text-decoration: none; color: #2B1810;' + sep(i, metas.length)
      })),
      rec: recs.map((r, i) => {
        const v = !!on[r.id];
        return {
          ...r,
          isDrop: r.icon === 'drop', isFork: r.icon === 'fork', isGym: r.icon === 'gym', isMoon: r.icon === 'moon',
          checked: v ? 'true' : 'false',
          toggle: () => this.setState({ on: { ...on, [r.id]: !v } }),
          row: 'display: flex; align-items: center; gap: 12px; min-height: 54px;' + sep(i, recs.length),
          track: 'width: 50px; height: 30px; flex-shrink: 0; border-radius: 999px; border: 0; padding: 3px; display: flex; justify-content: ' + (v ? 'flex-end' : 'flex-start') + '; background: ' + (v ? '#D13D0A' : '#DCCFC6') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
