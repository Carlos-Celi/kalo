<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kalo · Onboarding: estatura y peso</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a,button{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F97316;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8C7A6E}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:#D13D0A}a:hover{color:#9A2E06}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2B1810; display: flex; flex-direction: column; padding: 52px 20px 32px; gap: 20px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="Perfil.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 50%; background: #F8F1EB; color: #2B1810; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <div style="height: 5px; border-radius: 3px; background: #D13D0A;"></div>
      <div style="height: 5px; border-radius: 3px; background: #D13D0A;"></div>
      <div style="height: 5px; border-radius: 3px; background: #F2E4DA;"></div>
      <div style="height: 5px; border-radius: 3px; background: #F2E4DA;"></div>
    </div>
    <div style="font-size: 12px; font-weight: 600; color: #7A6458;">2/4</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -0.6px;">¿Cuánto mides y pesas?</h1>
    <p style="margin: 0; font-size: 14px; line-height: 1.5; color: #7A6458;">Desliza para ajustar. Podrás editarlo cuando quieras.</p>
  </div>

  <div style="padding: 18px; border-radius: 20px; background: #FFF8F2; border: 1px solid #F2E4DA; display: flex; flex-direction: column; gap: 10px;">
    <label for="estatura" style="font-size: 13px; font-weight: 600; color: #7A6458;">Estatura</label>
    <div style="display: flex; align-items: baseline; gap: 6px; color: #9A2E06;"><span style="font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1;">{{altura}}</span><span style="font-size: 16px; font-weight: 600; color: #7A6458;">cm</span></div>
    <input id="estatura" type="range" min="120" max="220" value="{{altura}}" onChange="{{setAltura}}" style="width: 100%; height: 28px; accent-color: #D13D0A;">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #7A6458; font-weight: 600;"><span>120 cm</span><span>220 cm</span></div>
  </div>

  <div style="padding: 18px; border-radius: 20px; background: #FFF8F2; border: 1px solid #F2E4DA; display: flex; flex-direction: column; gap: 10px;">
    <label for="peso" style="font-size: 13px; font-weight: 600; color: #7A6458;">Peso actual</label>
    <div style="display: flex; align-items: baseline; gap: 6px; color: #9A2E06;"><span style="font-size: 46px; font-weight: 800; letter-spacing: -1px; line-height: 1;">{{peso}}</span><span style="font-size: 16px; font-weight: 600; color: #7A6458;">kg</span></div>
    <input id="peso" type="range" min="30" max="200" value="{{peso}}" onChange="{{setPeso}}" style="width: 100%; height: 28px; accent-color: #D13D0A;">
    <div style="display: flex; justify-content: space-between; font-size: 12px; color: #7A6458; font-weight: 600;"><span>30 kg</span><span>200 kg</span></div>
  </div>

  <div style="display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: #FFF0E3; color: #9A2E06; font-size: 12px; font-weight: 600; line-height: 1.5;">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M3 12h4l3-7 4 14 3-7h4"></path></svg>
    {{imcLabel}}
  </div>
  <a href="Objetivos.dc.html" style="margin-top: auto; height: 54px; border-radius: 14px; background: #D13D0A; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Continuar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { altura: 172, peso: 78 };
  }
  renderVals() {
    const m = this.state.altura / 100;
    const imc = (this.state.peso / (m * m)).toFixed(1).replace('.', ',');
    return {
      altura: this.state.altura,
      peso: this.state.peso,
      imcLabel: 'Tu IMC estimado es ' + imc + '. Lo usamos solo como referencia.',
      setAltura: (e) => this.setState({ altura: Number(e.target.value) }),
      setPeso: (e) => this.setState({ peso: Number(e.target.value) })
    };
  }
}
</script>
</body>
</html>
