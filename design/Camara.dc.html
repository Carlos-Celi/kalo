<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kalo · Foto de tu comida</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a,button{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F97316;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8C7A6E}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:#FFD9A8}a:hover{color:#FFFFFF}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #2A0F08; font-family: 'Plus Jakarta Sans', sans-serif; color: #FFFFFF; display: flex; flex-direction: column; padding: 48px 16px 30px; gap: 16px; overflow: hidden;">
  <div style="display: flex; align-items: center; justify-content: space-between;">
    <a href="Inicio.dc.html" aria-label="Cerrar cámara" style="width: 44px; height: 44px; border-radius: 50%; background: #4A2216; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    <div style="font-size: 16px; font-weight: 700;">Foto de tu comida</div>
    <button type="button" aria-label="Activar flash" style="width: 44px; height: 44px; border-radius: 50%; border: 0; background: #4A2216; color: #FFFFFF; display: flex; align-items: center; justify-content: center;"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><path d="M13 2L4 14h7l-1 8 9-12h-7z"></path></svg></button>
  </div>

  <div role="group" aria-label="Tipo de comida" style="display: flex; gap: 8px; overflow-x: auto;">
    <sc-for list="{{types}}" as="t" hint-placeholder-count="5">
      <button type="button" aria-pressed="{{t.pressed}}" onClick="{{t.pick}}" style="{{t.style}}">{{t.label}}</button>
    </sc-for>
  </div>

  <div style="position: relative; flex-grow: 1; border-radius: 26px; background: #3D1A10; display: flex; align-items: center; justify-content: center;">
    <div style="position: absolute; top: 22px; left: 50%; transform: translateX(-50%); display: flex; align-items: center; gap: 6px; padding: 7px 12px; border-radius: 999px; background: #FFFFFF; color: #9A2E06; font-size: 12px; font-weight: 700; white-space: nowrap;">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.8 5.2L19 10l-5.2 1.8L12 17l-1.8-5.2L5 10l5.2-1.8z"></path></svg>
      IA lista · centra el plato
    </div>
    <div role="img" aria-label="Vista previa: plato con arroz, pollo y ensalada" style="position: relative; width: 240px; height: 240px; border-radius: 50%; background: #F2F0EA;">
      <div style="position: absolute; inset: 18px; border-radius: 50%; background: #FBFAF6;"></div>
      <div style="position: absolute; left: 44px; top: 62px; width: 96px; height: 72px; border-radius: 50%; background: #FFFFFF; border: 1px solid #ECE8DF;"></div>
      <div style="position: absolute; left: 130px; top: 54px; width: 64px; height: 50px; border-radius: 50%; background: #D9A25F;"></div>
      <div style="position: absolute; left: 140px; top: 100px; width: 58px; height: 44px; border-radius: 50%; background: #C7843E;"></div>
      <div style="position: absolute; left: 40px; top: 138px; width: 66px; height: 40px; border-radius: 50%; background: #3FA55B;"></div>
      <div style="position: absolute; left: 82px; top: 148px; width: 72px; height: 42px; border-radius: 50%; background: #66CC90;"></div>
      <div style="position: absolute; left: 150px; top: 152px; width: 22px; height: 22px; border-radius: 50%; background: #E5484D;"></div>
      <div style="position: absolute; left: 172px; top: 170px; width: 16px; height: 16px; border-radius: 50%; background: #E5484D;"></div>
    </div>
    <div style="position: absolute; top: 18px; left: 18px; width: 36px; height: 36px; border-top: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-radius: 12px 0 0 0;"></div>
    <div style="position: absolute; top: 18px; right: 18px; width: 36px; height: 36px; border-top: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-radius: 0 12px 0 0;"></div>
    <div style="position: absolute; bottom: 18px; left: 18px; width: 36px; height: 36px; border-bottom: 3px solid #FFFFFF; border-left: 3px solid #FFFFFF; border-radius: 0 0 0 12px;"></div>
    <div style="position: absolute; bottom: 18px; right: 18px; width: 36px; height: 36px; border-bottom: 3px solid #FFFFFF; border-right: 3px solid #FFFFFF; border-radius: 0 0 12px 0;"></div>
  </div>

  <div style="text-align: center; font-size: 13px; color: #E8C9B8; font-weight: 500;">La IA estimará calorías, azúcar y grasa en segundos.</div>

  <div style="display: flex; align-items: center; justify-content: space-between; padding: 0 18px;">
    <button type="button" style="width: 64px; border: 0; background: transparent; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 6px; font: 600 11px 'Plus Jakarta Sans', sans-serif;"><span style="width: 48px; height: 48px; border-radius: 50%; background: #4A2216; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="3"></rect><circle cx="9" cy="10" r="2"></circle><path d="M21 16l-5-5-9 9"></path></svg></span>Galería</button>
    <a href="Analisis.dc.html" aria-label="Tomar foto y analizar" style="width: 82px; height: 82px; border-radius: 50%; border: 4px solid #FFFFFF; box-sizing: border-box; display: flex; align-items: center; justify-content: center;"><span style="width: 64px; height: 64px; border-radius: 50%; background: #FFFFFF;"></span></a>
    <a href="Manual.dc.html" style="width: 64px; color: #FFFFFF; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 12px; font-weight: 600; text-decoration: none;"><span style="width: 48px; height: 48px; border-radius: 50%; background: #4A2216; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"></path></svg></span>Manual</a>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { picked: 'Almuerzo' };
  }
  renderVals() {
    return {
      types: ['Desayuno', 'Almuerzo', 'Cena', 'Snack', 'Licor'].map((l) => {
        const on = this.state.picked === l;
        return {
          label: on ? '✓ ' + l : l,
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ picked: l }),
          style: 'flex-shrink: 0; height: 40px; padding: 0 16px; border-radius: 999px; font: 600 13px \'Plus Jakarta Sans\', sans-serif; border: 0; background: ' + (on ? '#F97316' : '#4A2216') + '; color: ' + (on ? '#2A0F08' : '#FFFFFF') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
