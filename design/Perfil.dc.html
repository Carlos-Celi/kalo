<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Kalo · Onboarding: ¿cómo te llamas?</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&amp;display=swap">
<style>
body{margin:0}
body{-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
a,button{transition:transform .12s ease,background-color .15s ease,box-shadow .15s ease}
a:active,button:active{transform:scale(.97)}
a:focus-visible,button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid #F97316;outline-offset:2px}
input::placeholder,textarea::placeholder{color:#8C7A6E}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
a{color:#D13D0A}a:hover{color:#9A2E06}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #FFFFFF; font-family: 'Plus Jakarta Sans', sans-serif; color: #2B1810; display: flex; flex-direction: column; padding: 52px 20px 32px; gap: 22px;">
  <div style="display: flex; align-items: center; gap: 14px;">
    <a href="Login.dc.html" aria-label="Volver" style="width: 44px; height: 44px; border-radius: 50%; background: #F8F1EB; color: #2B1810; display: flex; align-items: center; justify-content: center;"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5l-7 7 7 7"></path></svg></a>
    <div style="flex-grow: 1; display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px;">
      <div style="height: 5px; border-radius: 3px; background: #D13D0A;"></div>
      <div style="height: 5px; border-radius: 3px; background: #F2E4DA;"></div>
      <div style="height: 5px; border-radius: 3px; background: #F2E4DA;"></div>
      <div style="height: 5px; border-radius: 3px; background: #F2E4DA;"></div>
    </div>
    <div style="font-size: 12px; font-weight: 600; color: #7A6458;">1/4</div>
  </div>
  <div style="display: flex; flex-direction: column; gap: 6px;">
    <h1 style="margin: 0; font-size: 27px; font-weight: 800; letter-spacing: -0.6px;">¿Cómo te llamas?</h1>
    <p style="margin: 0; font-size: 14px; color: #7A6458;">Cuéntanos lo básico para personalizar tu plan.</p>
  </div>
  <form style="display: flex; flex-direction: column; gap: 18px;">
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="nombre" style="font-size: 13px; font-weight: 600;">Nombre</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1.5px solid #F97316; border-radius: 14px; color: #D13D0A;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"></circle><path d="M4 21c1-4 4-6 8-6s7 2 8 6"></path></svg>
        <input id="nombre" type="text" placeholder="Tu nombre" style="border: 0; outline: none; flex-grow: 1; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #2B1810;">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 8px;">
      <label for="edad" style="font-size: 13px; font-weight: 600;">Edad</label>
      <div style="display: flex; align-items: center; gap: 10px; height: 52px; padding: 0 14px; border: 1px solid #F2E4DA; border-radius: 14px; background: #FFF8F2; color: #7A6458;">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="5" width="16" height="16" rx="2"></rect><path d="M4 10h16M8 3v4M16 3v4"></path></svg>
        <input id="edad" type="number" placeholder="Años" style="border: 0; outline: none; flex-grow: 1; font: 500 15px 'Plus Jakarta Sans', sans-serif; color: #2B1810; background: transparent;">
      </div>
    </div>
    <div style="display: flex; flex-direction: column; gap: 10px;">
      <div style="font-size: 13px; font-weight: 600;">Sexo</div>
      <div role="group" aria-label="Sexo" style="display: flex; flex-wrap: wrap; gap: 8px;">
        <sc-for list="{{sexos}}" as="s" hint-placeholder-count="3">
          <button type="button" aria-pressed="{{s.pressed}}" onClick="{{s.pick}}" style="{{s.style}}">{{s.label}}</button>
        </sc-for>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 14px; border-radius: 14px; background: #FFF0E3; color: #9A2E06; font-size: 12px; font-weight: 600; line-height: 1.5;">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round" aria-hidden="true" style="flex-shrink: 0;"><path d="M12 3l8 3v6c0 5-3.5 8-8 9-4.5-1-8-4-8-9V6z"></path></svg>
      Tus datos solo se usan para calcular tus metas diarias.
    </div>
  </form>
  <a href="Medidas.dc.html" style="margin-top: auto; height: 54px; border-radius: 14px; background: #D13D0A; color: #FFFFFF; font-size: 16px; font-weight: 700; display: flex; align-items: center; justify-content: center; text-decoration: none;">Continuar</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = { sexo: 'Masculino' };
  }
  renderVals() {
    return {
      sexos: ['Femenino', 'Masculino', 'Prefiero no decir'].map((l) => {
        const on = this.state.sexo === l;
        return {
          label: on ? '✓ ' + l : l,
          pressed: on ? 'true' : 'false',
          pick: () => this.setState({ sexo: l }),
          style: 'height: 44px; padding: 0 16px; border-radius: 999px; font: 600 14px \'Plus Jakarta Sans\', sans-serif; border: 1px solid ' + (on ? '#D13D0A' : '#F2E4DA') + '; background: ' + (on ? '#D13D0A' : '#FFF8F2') + '; color: ' + (on ? '#FFFFFF' : '#2B1810') + ';'
        };
      })
    };
  }
}
</script>
</body>
</html>
