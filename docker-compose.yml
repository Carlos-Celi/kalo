# Entorno local de Kalo. Guía: docs/tecnica/entorno-local.md
#
#   docker compose up web                             desarrollo  → http://localhost:5173
#   docker compose --profile preview up web-preview   producción  → http://localhost:8080
#
# Los puertos se publican solo en 127.0.0.1: no quedan expuestos en la red local.

# Distinto del `project_id` de Supabase ("kalo"): su CLI elimina todos los contenedores
# etiquetados con ese proyecto al hacer `supabase stop` o `supabase db reset`.
name: kalo-web

services:
  web:
    build:
      context: ./web
      target: dev
    ports:
      - '127.0.0.1:5173:5173'
    volumes:
      - ./web:/app
      # Las dependencias viven en el contenedor (binarios de Linux), no en el host.
      - web_node_modules:/app/node_modules

  web-preview:
    profiles: [preview]
    build:
      context: ./web
      target: preview
      # Para probar con Supabase: docker compose --env-file web/.env.local --profile preview up --build web-preview
      args:
        VITE_SUPABASE_URL: ${VITE_SUPABASE_URL:-}
        VITE_SUPABASE_PUBLISHABLE_KEY: ${VITE_SUPABASE_PUBLISHABLE_KEY:-}
        VITE_TURNSTILE_SITE_KEY: ${VITE_TURNSTILE_SITE_KEY:-}
    ports:
      - '127.0.0.1:8080:8080'
    read_only: true
    tmpfs:
      - /tmp
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

volumes:
  web_node_modules:
