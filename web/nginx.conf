# Sirve el build de producción en local imitando el despliegue:
# fallback de SPA y las mismas cabeceras de seguridad que web/vercel.json
# (docs/tecnica/seguridad.md). Única diferencia: aquí connect-src apunta al
# Supabase local en lugar de *.supabase.co, y no hay HSTS porque es http.
server {
    listen 8080;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' blob:; font-src 'self'; connect-src 'self' http://127.0.0.1:54321 http://localhost:54321 https://api.anthropic.com https://api.openai.com https://generativelanguage.googleapis.com; frame-src https://challenges.cloudflare.com; object-src 'none'; manifest-src 'self'; worker-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=(), payment=(), usb=(), serial=(), hid=(), bluetooth=(), midi=(), accelerometer=(), gyroscope=(), magnetometer=(), display-capture=(), screen-wake-lock=(), browsing-topics=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;
    add_header Origin-Agent-Cluster "?1" always;

    # Los archivos de /assets llevan hash en el nombre: se pueden cachear sin caducidad.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    # nginx no conoce la extensión del manifiesto; con nosniff necesita su tipo exacto.
    location = /site.webmanifest {
        default_type application/manifest+json;
        expires -1;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
